<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jepira | Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
    <link rel="icon" href="logo_jepira.png" type="image/png">
    <style>
        /* Estilos del contenedor de Login */
        .login-container {
            max-width: 420px;
            margin: 50px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .role-tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            color: #777;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            color: #2e7d32;
            border-bottom-color: #2e7d32;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .btn-submit:hover {
            background-color: #1b5e20;
        }
    </style>
</head>
<body>

    <!-- Header / Navegación Superior -->
    <header class="header-top">
        <div class="logo-section">
            <a href="index.html">
                <img src="logo_jepira.png" alt="Logo Jepira" class="logo-img"> 
            </a>
        </div>

        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="empresas.html">Empresas Aliadas</a></li>
                <li><a href="rutas.html">Rutas</a></li>
            </ul>
        </nav>

        <div class="header-icons">
            <span class="currency">COP</span>
            <a href="login.html" class="icon user" title="Mi Cuenta / Iniciar Sesión"></a>
        </div>
    </header>

    <!-- Formulario de Iniciar Sesión -->
    <main style="min-height: 70vh; display: flex; align-items: center; justify-content: center;">
        <div class="login-container">
            <h2 style="text-align: center; margin-bottom: 20px; color: #222;">Iniciar Sesión</h2>
            
            <!-- Selector de Rol -->
            <div class="role-tabs">
                <button type="button" class="tab-btn active" id="btn-viajero" onclick="seleccionarRol('viajero')">Viajero</button>
                <button type="button" class="tab-btn" id="btn-empresa" onclick="seleccionarRol('empresa')">Empresa Aliada</button>
            </div>

            <form id="login-form">
                <!-- Campo oculto para registrar el tipo de usuario -->
                <input type="hidden" id="user-role" value="viajero">

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="correo@ejemplo.com">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-submit">Ingresar</button>
            </form>
        </div>
    </main>

    <!-- Footer Institucional -->
    <footer class="main-footer">
        <div class="footer-content" style="display: flex !important; justify-content: space-between !important; align-items: center !important; max-width: 1000px !important; margin: 0 auto !important;">
            <div class="footer-col support" style="flex: 1 !important;">
                <h3 style="font-size: 1.05rem; font-weight: 700; color: #222; margin-bottom: 12px;">Soporte</h3>
                <p style="color: #555; margin: 0 0 6px 0; font-size: 0.9rem;">3217293985</p>
                <p style="color: #555; margin: 0; font-size: 0.9rem;">contacto@jepira.com</p>
            </div>

            <div class="footer-col navigation" style="flex: 1 !important;">
                <h3 style="font-size: 1.05rem; font-weight: 700; color: #222; margin-bottom: 12px;">Turismo Sostenible</h3>
                <ul style="list-style: none; padding: 0; margin: 0;">
                    <li style="margin-bottom: 6px;"><a href="index.html" style="text-decoration: none; color: #555; font-size: 0.9rem;">Inicio</a></li>
                    <li style="margin-bottom: 6px;"><a href="empresas.html" style="text-decoration: none; color: #555; font-size: 0.9rem;">Empresas Aliadas</a></li>
                    <li style="margin-bottom: 6px;"><a href="rutas.html" style="text-decoration: none; color: #555; font-size: 0.9rem;">Reservas</a></li>
                </ul>
            </div>

            <div class="footer-col logo-container" style="flex: 1 !important; display: flex !important; justify-content: flex-end !important; align-items: center !important;">
                <img src="logo_jepira.png" alt="Jepira Turismo Sostenible" class="footer-logo" style="width: 160px !important; max-width: 160px !important; height: auto !important; display: block !important;">
            </div>
        </div>
    </footer>

    <!-- Lógica de redirección JavaScript -->
    <script>
        function seleccionarRol(rol) {
            document.getElementById('user-role').value = rol;
            const btnViajero = document.getElementById('btn-viajero');
            const btnEmpresa = document.getElementById('btn-empresa');

            if (rol === 'viajero') {
                btnViajero.classList.add('active');
                btnEmpresa.classList.remove('active');
            } else {
                btnEmpresa.classList.add('active');
                btnViajero.classList.remove('active');
            }
        }

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const role = document.getElementById('user-role').value;

            if (role === 'empresa') {
                window.location.href = 'panel-empresa.html';
            } else {
                window.location.href = 'mis-reservas.html';
            }
        });
    </script>
</body>
</html>
