<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jepira | Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
    <link rel="icon" href="logo_jepira.png" type="image/png">
    <style>
        .login-wrapper {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .login-container {
            width: 100%;
            max-width: 520px;
            padding: 40px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        .login-card-logo {
            width: 140px;
            max-width: 140px;
            height: auto;
            margin: 0 auto 15px auto;
            display: block;
        }

        .login-container h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1b4332;
            margin-bottom: 25px;
        }

        .role-tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            color: #666;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #2e7d32;
            border-bottom-color: #2e7d32;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            border-color: #2e7d32;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #1b5e20;
        }

        #mensaje-login {
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .forgot-password {
            display: inline-block;
            margin-top: 15px;
            color: #2e7d32;
            font-size: 0.88rem;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .register-link {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 0.9rem;
            color: #555;
        }

        .register-link a {
            color: #2e7d32;
            font-weight: 700;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Header / Navegación Superior -->
    <header class="header-top">
        <div class="logo-section">
            <a href="index.html">
                <img src="logo_jepira.png" alt="Logo Jepira" class="logo-img"> 
            </a>
        </div>

        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="empresas.html">Empresas Aliadas</a></li>
                <li><a href="rutas.html">Rutas</a></li>
            </ul>
        </nav>

        <div class="header-icons">
            <span class="currency">COP</span>
            <a href="login.html" class="icon user" title="Mi Cuenta / Iniciar Sesión"></a>
        </div>
    </header>

    <!-- Formulario de Iniciar Sesión -->
    <main class="login-wrapper">
        <div class="login-container">
            <!-- Logo Centrado Superior -->
            <img src="logo_jepira.png" alt="Logo Jepira" class="login-card-logo">
            
            <h2>Iniciar Sesión</h2>
            
            <!-- Selector de Rol -->
            <div class="role-tabs">
                <button type="button" class="tab-btn active" id="btn-viajero" onclick="seleccionarRol('explorer')">Viajero</button>
                <button type="button" class="tab-btn" id="btn-empresa" onclick="seleccionarRol('corporate')">Empresa Aliada</button>
            </div>

            <form id="form-login">
                <!-- Campo Oculto para almacenar el rol seleccionado -->
                <input type="hidden" id="login-tipo" value="explorer">

                <div class="form-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" placeholder="Tu contraseña" required>
                </div>

                <button type="submit" class="btn-submit">Iniciar Sesión</button>
            </form>

            <!-- Mensaje para mostrar respuesta de éxito o error -->
            <div id="mensaje-login"></div>

            <a href="recuperar-password.html" class="forgot-password">¿Olvidaste tu contraseña?</a>

            <div class="register-link">
                ¿Aún no tienes cuenta? <a href="registro.html">Crea tu perfil aquí</a>
            </div>
        </div>
    </main>

    <!-- Footer Institucional -->
    <footer class="main-footer">
        <div class="footer-content" style="display: flex !important; justify-content: space-between !important; align-items: center !important; max-width: 1000px !important; margin: 0 auto !important;">
            <div class="footer-col support" style="flex: 1 !important;">
                <h3 style="font-size: 1.05rem; font-weight: 700; color: #222; margin-bottom: 12px;">Soporte</h3>
                <p style="color: #555; margin: 0 0 6px 0; font-size: 0.9rem;">3217293985</p>
                <p style="color: #555; margin: 0; font-size: 0.9rem;">contacto@jepira.com</p>
            </div>

            <div class="footer-col navigation" style="flex: 1 !important;">
                <h3 style="font-size: 1.05rem; font-weight: 700; color: #222; margin-bottom: 12px;">Turismo Sostenible</h3>
                <ul style="list-style: none; padding: 0; margin: 0;">
                    <li style="margin-bottom: 6px;"><a href="index.html" style="text-decoration: none; color: #555; font-size: 0.9rem;">Inicio</a></li>
                    <li style="margin-bottom: 6px;"><a href="empresas.html" style="text-decoration: none; color: #555; font-size: 0.9rem;">Empresas Aliadas</a></li>
                    <li style="margin-bottom: 6px;"><a href="rutas.html" style="text-decoration: none; color: #555; font-size: 0.9rem;">Reservas</a></li>
                </ul>
            </div>

            <div class="footer-col logo-container" style="flex: 1 !important; display: flex !important; justify-content: flex-end !important; align-items: center !important;">
                <img src="logo_jepira.png" alt="Jepira Turismo Sostenible" class="footer-logo" style="width: 160px !important; max-width: 160px !important; height: auto !important; display: block !important;">
            </div>
        </div>
    </footer>

    <!-- Script de Selección de Rol -->
    <script>
        function seleccionarRol(rol) {
            document.getElementById('login-tipo').value = rol;
            const btnViajero = document.getElementById('btn-viajero');
            const btnEmpresa = document.getElementById('btn-empresa');

            if (rol === 'explorer') {
                btnViajero.classList.add('active');
                btnEmpresa.classList.remove('active');
            } else {
                btnEmpresa.classList.add('active');
                btnViajero.classList.remove('active');
            }
        }
    </script>

    <!-- Módulo JS principal que conecta la autenticación -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
