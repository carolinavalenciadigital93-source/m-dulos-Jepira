<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jepira | Panel del Viajero</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
    <link rel="icon" href="img/logo_jepira.png" type="image/png">
    <style>
        .dashboard-wrapper {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            min-height: 70vh;
        }

        .dashboard-header {
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .dashboard-header h2 {
            color: #1b4332;
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        .dashboard-header p {
            color: #666;
            font-size: 0.9rem;
            margin: 0;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-primary {
            padding: 10px 18px;
            background-color: #2e7d32;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }

        .btn-primary:hover {
            background-color: #1b5e20;
        }

        .btn-logout {
            padding: 10px 16px;
            background-color: #fff;
            color: #d32f2f;
            border: 1px solid #d32f2f;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background-color: #d32f2f;
            color: white;
        }

        /* Tabs de navegación del panel */
        .panel-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            padding: 12px 20px;
            background: none;
            border: none;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #2e7d32;
            border-bottom-color: #2e7d32;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Estilos Sección Mi Perfil */
        .profile-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
        }

        .avatar-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin-bottom: 30px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #e0e0e0;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #888;
        }

        .avatar-edit-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #ffffff;
            border: 1px solid #ccc;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .profile-field {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .field-info label {
            display: block;
            font-size: 0.82rem;
            color: #777;
            font-weight: 500;
            margin-bottom: 3px;
        }

        .field-info span {
            font-size: 0.95rem;
            color: #222;
            font-weight: 600;
        }

        .btn-edit-field {
            background: none;
            border: none;
            color: #2e7d32;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Estilos Sección Reservas */
        .reservation-card {
            background: #ffffff;
            padding: 20px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .res-title {
            font-weight: 700;
            color: #1b4332;
            font-size: 1.1rem;
            margin-bottom: 6px;
        }

        .res-details {
            font-size: 0.88rem;
            color: #555;
            line-height: 1.5;
        }

        .badge-confirmed {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.82rem;
        }

        .badge-pending {
            background: #fff8e1;
            color: #f57f17;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.82rem;
        }

        .btn-secondary {
            padding: 8px 16px;
            border: 1px solid #2e7d32;
            color: #2e7d32;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.88rem;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: #2e7d32;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Header / Navegación Superior -->
    <header class="header-top">
        <div class="logo-section">
            <a href="index.html">
                <img src="img/logo_jepira.png" alt="Logo Jepira" class="logo-img"> 
            </a>
        </div>

        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="empresas.html">Empresas Aliadas</a></li>
                <li><a href="rutas.html">Rutas</a></li>
            </ul>
        </nav>

        <div class="header-icons">
            <span class="currency">COP</span>
            <a href="mis-reservas.html" class="icon user" title="Mi Cuenta"></a>
        </div>
    </header>

    <main class="dashboard-wrapper">

        <!-- Encabezado del Panel -->
        <div class="dashboard-header">
            <div>
                <h2>Panel del Viajero</h2>
                <p>Gestiona tus datos personales y tus reservas activas</p>
            </div>
            <div class="header-actions">
                <a href="rutas.html" class="btn-primary">+ Explorar más rutas</a>
                <button id="btn-logout-user" class="btn-logout">Cerrar Sesión</button>
            </div>
        </div>

        <!-- Pestañas de Selección -->
        <div class="panel-tabs">
            <button class="tab-btn active" id="tab-btn-perfil">Mi Perfil</button>
            <button class="tab-btn" id="tab-btn-reservas">Mis Reservas</button>
        </div>

       <!-- SECCIÓN MI PERFIL -->
<div id="seccion-mi-perfil" class="profile-card">
    <form id="form-perfil-viajero">
        
        <!-- Nombre Completo -->
        <div class="profile-field-group">
            <label for="perfil-nombre">Nombre Completo</label>
            <input type="text" id="perfil-nombre" value="Daniela Valencia test" disabled />
        </div>

        <!-- E-mail -->
        <div class="profile-field-group">
            <label for="perfil-email">E-mail</label>
            <input type="email" id="perfil-email" value="dani19@gmail.com" disabled />
        </div>

        <!-- Teléfono -->
        <div class="profile-field-group">
            <label for="perfil-telefono">Teléfono</label>
            <input type="text" id="perfil-telefono" value="3105678940" disabled />
        </div>

        <!-- Documento -->
        <div class="profile-field-group">
            <label for="perfil-documento">Documento de Identidad o NIT</label>
            <input type="text" id="perfil-documento" value="25467898" disabled />
        </div>

        <!-- Teléfono Secundario -->
        <div class="profile-field-group">
            <label for="perfil-telefono-secundario">Teléfono Secundario / Emergencia</label>
            <input type="text" id="perfil-telefono-secundario" value="" placeholder="Sin registrar" disabled />
        </div>

        <!-- Botones de Acción -->
        <div class="profile-actions" style="margin-top: 20px; display: flex; gap: 10px;">
            <button type="button" id="btn-habilitar-edicion-perfil" class="btn-secondary">
                Editar Perfil Completo
            </button>
            <button type="submit" id="btn-guardar-perfil-viajero" class="btn-primary" style="display: none;">
                Guardar Cambios
            </button>
        </div>

        <p id="mensaje-perfil-viajero" style="margin-top: 10px; font-weight: bold;"></p>
    </form>
</div>             

        <!-- SECCIÓN 2: MIS RESERVAS -->
        <div id="seccion-reservas" class="tab-content">
            <div id="contenedor-reservas">
                <!-- Se renderizan dinámicamente desde JS -->
            </div>
        </div>

    </main>

    <!-- Footer Institucional -->
    <footer class="main-footer">
        <div class="footer-content" style="display: flex !important; justify-content: space-between !important; align-items: center !important; max-width: 1000px !important; margin: 0 auto !important;">
            <div class="footer-col support" style="flex: 1 !important;">
                <h3 style="font-size: 1.05rem; font-weight: 700; color: #222; margin-bottom: 12px;">Soporte</h3>
                <p style="color: #555; margin: 0 0 6px 0; font-size: 0.9rem;">3217293985</p>
                <p style="color: #555; margin: 0; font-size: 0.9rem;">contacto@jepira.com</p>
            </div>

            <div class="footer-col navigation" style="flex: 1 !important;">
                <h3 style="font-size: 1.05rem; font-weight: 700; color: #222; margin-bottom: 12px;">Turismo Sostenible</h3>
                <ul style="list-style: none; padding: 0; margin: 0;">
                    <li style="margin-bottom: 6px;"><a href="index.html" style="text-decoration: none; color: #555; font-size: 0.9rem;">Inicio</a></li>
                    <li style="margin-bottom: 6px;"><a href="empresas.html" style="text-decoration: none; color: #555; font-size: 0.9rem;">Empresas Aliadas</a></li>
                    <li style="margin-bottom: 6px;"><a href="rutas.html" style="text-decoration: none; color: #555; font-size: 0.9rem;">Reservas</a></li>
                </ul>
            </div>

            <div class="footer-col logo-container" style="flex: 1 !important; display: flex !important; justify-content: flex-end !important; align-items: center !important;">
                <img src="img/logo_jepira.png" alt="Jepira Turismo Sostenible" class="footer-logo" style="width: 160px !important; max-width: 160px !important; height: auto !important; display: block !important;">
            </div>
        </div>
    </footer>

    <!-- Módulo JS Principal e Integración de Reservas -->
    <script type="module">
        import { ReservationsModule } from './js/modules/reservations.js'; // Ajusta la ruta a tu estructura de carpetas si es necesario

        const reservationsModule = new ReservationsModule();

        // Obtener usuario autenticado actual desde localStorage
        const currentUser = JSON.parse(localStorage.getItem('jepira_current_user')) || {
            id: 'usr_demo',
            name: 'Viajero Jepira',
            email: 'viajero@jepira.com',
            phone: '3000000000'
        };

        // 1. Manejo de Pestañas
        const tabPerfil = document.getElementById('tab-btn-perfil');
        const tabReservas = document.getElementById('tab-btn-reservas');
        const seccionPerfil = document.getElementById('seccion-perfil');
        const seccionReservas = document.getElementById('seccion-reservas');

        tabPerfil.addEventListener('click', () => {
            tabPerfil.classList.add('active');
            tabReservas.classList.remove('active');
            seccionPerfil.classList.add('active');
            seccionReservas.classList.remove('active');
        });

        tabReservas.addEventListener('click', () => {
            tabReservas.classList.add('active');
            tabPerfil.classList.remove('active');
            seccionReservas.classList.add('active');
            seccionPerfil.classList.remove('active');
        });

        // 2. Cargar datos del perfil
        function loadUserProfile() {
            if (currentUser) {
                document.getElementById('text-nombre').textContent = currentUser.name || 'Sin registrar';
                document.getElementById('text-email').textContent = currentUser.email || 'Sin registrar';
                document.getElementById('text-telefono').textContent = currentUser.phone || 'Sin registrar';
                if (currentUser.document) document.getElementById('text-doc').textContent = currentUser.document;
                if (currentUser.secondaryPhone) document.getElementById('text-tel2').textContent = currentUser.secondaryPhone;
            }
        }

        // 3. Renderizar reservas del usuario
        function renderReservations() {
            const container = document.getElementById('contenedor-reservas');
            if (!container) return;

            if (!currentUser || !currentUser.id) {
                container.innerHTML = `<p style="text-align:center; color:#666;">Debes iniciar sesión para ver tus reservas.</p>`;
                return;
            }

            const userReservations = reservationsModule.getReservationsByUser(currentUser.id);

            if (userReservations.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
                        <p style="color: #666; font-size: 1rem; margin-bottom: 15px;">Aún no tienes reservas activas.</p>
                        <a href="rutas.html" class="btn-primary" style="display: inline-block;">Ver Rutas Disponibles</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = userReservations.map(res => {
                const fechaFormat = new Date(res.bookingDate).toLocaleDateString('es-CO', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                const precioTotal = new Intl.NumberFormat('es-CO', { 
                    style: 'currency', 
                    currency: 'COP', 
                    maximumFractionDigits: 0 
                }).format(res.totalPrice);

                return `
                    <div class="reservation-card" id="card-${res.id}">
                        <div>
                            <div class="res-title">${res.routeTitle}</div>
                            <div class="res-details">
                                <strong>Fecha de reserva:</strong> ${fechaFormat}<br>
                                <strong>Cupos reservados:</strong> ${res.seatsBooked}<br>
                                <strong>Total:</strong> ${precioTotal}
                            </div>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 10px;">
                            <span class="badge-confirmed">Confirmada</span>
                            <button class="btn-logout btn-cancelar-reserva" data-id="${res.id}" style="padding: 6px 12px; font-size: 0.8rem;">
                                Cancelar Reserva
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            // Asignar eventos a los botones de cancelación
            document.querySelectorAll('.btn-cancelar-reserva').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const resId = e.target.getAttribute('data-id');
                    if (confirm("¿Estás seguro de cancelar esta reserva? Los cupos serán liberados.")) {
                        const result = reservationsModule.cancelReservation(resId, currentUser.id);
                        alert(result.message);
                        if (result.success) {
                            renderReservations();
                        }
                    }
                });
            });
        }

        // 4. Edición rápida de campos de perfil
        document.querySelectorAll('.btn-edit-field').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const campoNombre = e.target.getAttribute('data-campo');
                const targetId = e.target.getAttribute('data-target');
                const elemento = document.getElementById(targetId);
                const nuevoValor = prompt(`Ingresa tu nuevo ${campoNombre}:`, elemento.textContent);
                if (nuevoValor !== null && nuevoValor.trim() !== "") {
                    elemento.textContent = nuevoValor.trim();
                }
            });
        });

        // 5. Cargar vista previa de imagen de perfil
        document.getElementById('avatar-input').addEventListener('change', (event) => {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('avatar-preview');
                output.innerHTML = `<img src="${reader.result}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
            };
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        });

        // 6. Evento de Cerrar Sesión
        document.getElementById('btn-logout-user').addEventListener('click', () => {
            localStorage.removeItem('jepira_current_user');
            window.location.href = 'index.html';
        });

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            loadUserProfile();
            renderReservations();
        });
    </script>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
